    <style>body{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;background-color:#0d0e15;margin:0;overflow:hidden}.controller,.actions{display:none!important}body.touch-controls-enabled .controller,body.touch-controls-enabled .actions{display:block!important}@media (pointer:fine) and (hover:hover){.controller,.actions{display:none!important}}:root{--pad-size:170px;--btn-size:52px;--btn-bg:#ffffff14;--btn-border:#ffffff29;--btn-active:#ffffff47}.controller,.actions{z-index:20;width:var(--pad-size);height:var(--pad-size);-webkit-backdrop-filter:blur(12px);touch-action:none;background:radial-gradient(circle,#14182373 0%,#0a0c12a6 100%);border:1px solid #ffffff1a;border-radius:50%;position:absolute;bottom:28px;box-shadow:0 8px 32px #00000073,inset 0 1px 1px #ffffff1f}.controller{left:28px}.actions{right:28px}.controller>div,.actions>div{width:var(--btn-size);height:var(--btn-size);cursor:pointer;background:var(--btn-bg);border:1px solid var(--btn-border);-webkit-tap-highlight-color:transparent;border-radius:50%;justify-content:center;align-items:center;transition:transform 80ms,background 80ms,box-shadow 80ms;display:flex;position:absolute;box-shadow:0 4px 12px #00000059,inset 0 1px 2px #ffffff26}.controller>div:active,.actions>div:active{background:var(--btn-active);transform:scale(.91);box-shadow:0 2px 6px #00000080,inset 0 2px 4px #0006}.controller-top,.action-attack{top:8px;left:calc(50% - var(--btn-size) / 2)}.controller-down,.action-roll{bottom:8px;left:calc(50% - var(--btn-size) / 2)}.controller-left{left:8px;top:calc(50% - var(--btn-size) / 2)}.controller-right,.action-secondary{right:8px;top:calc(50% - var(--btn-size) / 2)}.controller-hold{opacity:.6;border-radius:50%;top:calc(50% - 17px);left:calc(50% - 17px);width:34px!important;height:34px!important}.controller>div:after{content:"";border-style:solid;width:0;height:0}.controller-top:after{border-width:0 7px 11px;border-color:#0000 #0000 #ffffffd9}.controller-down:after{border-width:11px 7px 0;border-color:#ffffffd9 #0000 #0000}.controller-left:after{border-width:7px 11px 7px 0;border-color:#0000 #ffffffd9 #0000 #0000}.controller-right:after{border-width:7px 0 7px 11px;border-color:#0000 #0000 #0000 #ffffffd9}.controller-hold:after{content:"";background:#ffffffb3;border-radius:50%;width:8px;height:8px}.actions>div{letter-spacing:.8px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:700}.action-attack{color:#ff526c;background:radial-gradient(circle,#ff526c26 0%,#ff526c0d 100%);border-color:#ff526c59}.action-roll{color:#4da4ff;background:radial-gradient(circle,#4da4ff26 0%,#4da4ff0d 100%);border-color:#4da4ff59}.action-secondary{color:#c471ed;background:radial-gradient(circle,#c471ed26 0%,#c471ed0d 100%);border-color:#c471ed59}.rotate-overlay{z-index:9999;-webkit-backdrop-filter:blur(10px);color:#fff;text-align:center;background:#0a0c12f0;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:32px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-size:17px;font-weight:500;display:none;position:fixed;inset:0}.rotate-overlay svg{opacity:.9;width:72px;height:72px;animation:2s ease-in-out infinite rock}@keyframes rock{0%,to{transform:rotate(0)}30%,70%{transform:rotate(90deg)}}@media (pointer:coarse) and (orientation:portrait){.rotate-overlay{display:flex}}</style>

  </head>
  <body>
    <div class="controller">
        <div class="controller-top"></div>
        <div class="controller-hold"></div>
        <div class="controller-right"></div>
        <div class="controller-left"></div>
        <div class="controller-down"></div>
    </div>

    <!-- RIGHT SIDE: action buttons -->
    <div class="actions">
        <div class="action-attack">ATK</div>
        <div class="action-roll">ROLL</div>
        <div class="action-secondary">SEC</div>
    </div>


    <!-- rotate-your-phone overlay (CSS hides it in landscape / on desktop) -->
    <div class="rotate-overlay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2" />
        <line x1="12" y1="18" x2="12" y2="18.01" stroke-width="2" />
      </svg>
      <span>Rotate your device to landscape</span>
    </div>


    <!-- try to auto-lock orientation to landscape -->
    <script>
      (function () {
        // The Screen Orientation API only works in fullscreen or installed PWA mode.
        // On first tap we request fullscreen, then lock to landscape.
        function tryLock() {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(function () {
              // Silently ignore — the CSS overlay handles the fallback.
            });
          }
        }

        // Attempt immediately (works in PWA / already-fullscreen contexts).
        tryLock();

        // On the first user interaction, go fullscreen + lock.
        document.addEventListener('touchstart', function onTouch() {
          document.removeEventListener('touchstart', onTouch);
          var el = document.documentElement;
          var rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
          if (rfs) {
            rfs.call(el).then(tryLock).catch(function () {});
          }
        }, { once: true });
      })();
    </script>
  </body>
</html>
